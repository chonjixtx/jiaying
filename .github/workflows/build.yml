name: Build JiayingGameTweak

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [ rootless, rootful ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dpkg and fakeroot
        run: brew install dpkg fakeroot

      - name: Setup Theos (with SDKs)
        uses: waruhachi/theos-action@v2.6.5

      - name: Check toolchain
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS/sdks/" | head -20
          which dpkg-deb
          which ldid

      - name: Build deb
        run: |
          chmod +x build.sh
          ./build.sh ${{ matrix.scheme }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JiayingGameTweak-${{ matrix.scheme }}
          path: artifacts/JiayingGameTweak-${{ matrix.scheme }}.deb
          if-no-files-found: error
          retention-days: 30
