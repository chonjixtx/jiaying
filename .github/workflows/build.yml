name: Build JiayingGameTweak

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [ rootless, rootful ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dpkg
        run: brew install dpkg

      - name: Setup Theos (with SDKs)
        uses: waruhachi/theos-action@v2.6.5

      - name: Bypass fakeroot (Apple Silicon arm64e issue)
        run: |
          DEB_MK="$THEOS/makefiles/package/deb.mk"
          perl -pi -e 's/\Q$(FAKEROOT) -r \E//' "$DEB_MK"
          echo "--- patched packaging line ---"
          grep -n 'COPYFILE_DISABLE' "$DEB_MK"
          if grep 'COPYFILE_DISABLE' "$DEB_MK" | grep -q 'FAKEROOT'; then
            echo "::error::Failed to remove FAKEROOT from deb.mk"
            exit 1
          fi

      - name: Check toolchain
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS/sdks/" | head -20
          which dpkg-deb
          which ldid

      - name: Build deb
        run: |
          chmod +x build.sh
          ./build.sh ${{ matrix.scheme }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JiayingGameTweak-${{ matrix.scheme }}
          path: artifacts/JiayingGameTweak-${{ matrix.scheme }}.deb
          if-no-files-found: error
          retention-days: 30
